# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. 
on:
  # Build at 00:00 on every 3rd day-of-month.
  schedule:
    - cron: "0 0 */3 * *"
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ test ]
    paths-ignore: [ '**/README.md' ]
  pull_request:
    branches: [ test ]
    paths-ignore: [ '**/README.md' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "cncra"
  cncra:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Runs a set of commands using the runners shell
      - name: Run a single-line script
        run: |
          sudo apt update && sudo apt install libfuse2 zsync -y && sudo wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool && sudo chmod +x /usr/local/bin/appimagetool
          bash deploy.sh stable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cncra-continuous-x86_64.AppImage
          path: '/home/runner/work/cncra_AppImage/cncra_AppImage/dist'

  # This workflow contains a single job called "cncra-wp"
  cncra-wp:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          sudo dpkg --add-architecture i386 && sudo apt update && sudo apt install libfuse2 libfuse2:i386 libglu1-mesa:i386 zsync && sudo wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool && sudo chmod +x /usr/local/bin/appimagetool
          xvfb-run --server-args="-screen 0 1024x768x24" bash deploy.sh stablewp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cncra-continuous-wp-x86_64.AppImage
          path: '/home/runner/work/cncra_AppImage/cncra_AppImage/dist'

  release-stable:
    needs: [cncra]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cncra-continuous-x86_64.AppImage
          path: /home/runner/work/cncra_AppImage/cncra_AppImage/cncra-continuous-x86_64.AppImage

      - name: release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          title: cncra stable
          automatic_release_tag: stable
          prerelease: false
          draft: false
          files: |
            cncra-continuous-x86_64.AppImage
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  release-stable-wp:
    needs: [cncra-wp]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cncra-continuous-wp-x86_64.AppImage
          path: /home/runner/work/cncra_AppImage/cncra_AppImage/cncra-continuous-wp-x86_64.AppImage

      - name: release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          title: cncra stable with wineprefix
          automatic_release_tag: stable-wp
          prerelease: false
          draft: false
          files: |
            cncra-continuous-wp-x86_64.AppImage
          repo_token: ${{ secrets.GITHUB_TOKEN }}
